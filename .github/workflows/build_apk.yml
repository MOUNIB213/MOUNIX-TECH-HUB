name: Build MOUNIX TECH HUB Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Release APK (MOUNIX TECH HUB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Android Gradle Wrapper & Dependencies
        run: |
          flutter config --no-analytics
          flutter create --platforms=android --org com.mounix --project-name mounix_tech_hub .
          flutter pub get

      - name: Build Release APK
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          flutter build apk --release --no-tree-shake-icons --dart-define=YOUTUBE_API_KEY="${YOUTUBE_API_KEY}"

      - name: Upload MOUNIX TECH HUB APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MOUNIX-TECH-HUB-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
